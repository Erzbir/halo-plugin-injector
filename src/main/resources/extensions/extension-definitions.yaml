apiVersion: plugin.halo.run/v1alpha1
kind: ExtensionDefinition
metadata:
  name: ext-def-injector-head
spec:
  extensionPointName: template-head-processor
  className: com.erzbir.injector.halo.process.InjectorHeadProcessor
  displayName: "InjectorHeadProcessor"
  description: "Inject code into <head>"
---
apiVersion: plugin.halo.run/v1alpha1
kind: ExtensionDefinition
metadata:
  name: ext-def-injector-footer
spec:
  extensionPointName: template-footer-processor
  className: com.erzbir.injector.halo.process.InjectorFooterProcessor
  displayName: "InjectorFooterProcessor"
  description: "Inject code into <footer>"
---
apiVersion: plugin.halo.run/v1alpha1
kind: ExtensionDefinition
metadata:
  name: ext-def-injector-additional-webfilter
spec:
  extensionPointName: additional-webfilter
  className: com.erzbir.injector.halo.filter.InjectorWebFilter
  displayName: "InjectorWebFilter"
  description: "Inject code into whole HTML"
